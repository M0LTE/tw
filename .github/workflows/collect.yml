name: Collect faults

# Takes an hourly snapshot of Thames Water's public fault map and commits the
# change log, then asks deploy.yml to republish. Collection and publishing are
# separate workflows so either can happen without the other: a UI fix ships by
# being merged, and a snapshot ships without needing a code change.
#
# Hourly rather than twice daily because resolution not collected is gone for
# good, while bytes are cheap: a run is 23 requests and under two minutes, and a
# poll that finds nothing changed commits nothing and deploys nothing. Twice
# daily could not tell whether the 2026-08-05 departure of 4,272 faults was one
# purge or a bleed across the day (#21, #23).
#
# Note: GitHub only runs `schedule` triggers on the repository's default branch.
on:
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Write the delta even if the poll looks truncated'
        type: boolean
        default: false

# Never let two collections race: they would both diff against the same previous
# state and double-count. Matters more hourly than it did twice daily, since a
# slow run and the next schedule can now overlap.
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Poll the fault map
        run: |
          set -o pipefail
          python -m collector.collect ${{ inputs.force && '--force' || '' }} \
            | tee /tmp/summary.json

      - name: Commit the change log
        run: |
          git config user.name  'thames-water-fault-tracker[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/deltas
          if git diff --cached --quiet; then
            echo 'Nothing changed since the last run.'
            exit 0
          fi
          git commit -m "Snapshot $(date -u +%Y-%m-%dT%H:%MZ): $(jq -r '
            def m(k): .changes[k] // {appeared:0,resolved:0};
            if .truncated then
              "source truncated (" + ([.truncated | to_entries[]
                | "\(.key) \((.value * 100) | floor)% retained"] | join(", "))
              + "), counts only — no record changes applied"
            else
              "\(.open) faults (+\(m("work_order").appeared)/-\(m("work_order").resolved)), " +
              "\(.reports) reports (+\(m("report").appeared)/-\(m("report").resolved))"
            end
          ' /tmp/summary.json)"
          # Another run may have pushed while we were collecting.
          for attempt in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && \
              git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $(( 2 ** attempt ))
          done
          exit 1

  # Republish with the data just collected. deploy.yml checks out the branch
  # tip, so it picks up the snapshot commit made above.
  publish:
    needs: collect
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
