name: Tests

on:
  push:
    branches-ignore: []
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      # The browser half of the site takes decisions of its own — whether a
      # status contradicts its own line-item count, whether the page admits it
      # has stopped collecting — and those went untested until #39. No
      # dependencies: node --test is in the standard library.
      - name: Web unit tests
        run: node --test 'tests/*.test.mjs'

      - name: Rebuild the database from the change log
        run: python -m collector.collect --rebuild-only

      - name: Build the site data
        run: python -m collector.build_site

      - name: Check the site data is well formed
        run: |
          python - <<'PY'
          import json, pathlib
          for name in ('summary.json', 'open.json'):
              data = json.loads(pathlib.Path('web/data', name).read_text())
              print(f'{name}: ok')
          summary = json.loads(pathlib.Path('web/data/summary.json').read_text())
          open_ = json.loads(pathlib.Path('web/data/open.json').read_text())
          assert summary['totals']['open'] == len(open_['cols']['id']), 'open count mismatch'
          assert summary['totals']['open'] > 0, 'no open faults'
          print(f"{summary['totals']['open']} open faults")
          PY
